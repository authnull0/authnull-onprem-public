# authnull-service configuration
#
# Loaded by internal/pam/conf/config.go via Viper, called from main() before
# routes are registered. Despite living under internal/pam, these keys are read
# by the issuer, policy, serviceaccounts and pam modules.
#
# All runtime keys are nested under the active environment prefix, selected by
# the top-level `env` key. The ENV environment variable overrides `env`.
#
# SECRETS ARE NOT STORED HERE. Keys left blank are populated at startup from
# environment variables by conf.applyEnvOverrides() -- see that function for the
# authoritative key -> env var mapping. Values set here are non-secret defaults.

env: local

local:
  port: "8080"

  # Populated from DB_NAME.
  db:
    name: ""

  # Populated from REDIS_HOST (host:port) and REDIS_PASSWORD.
  # Used by the issuer module to store DID private keys.
  redis:
    host: ""
    key: ""

  # Directory the pam and issuer audit loggers write into.
  logger:
    path: /var/log/authnull

  files:
    csv:
      base_path: /var/authnull/uploads/csv
    ldif:
      base_path: /var/authnull/uploads/ldif

  storage:
    local:
      enabled: true
    aws:
      enabled: false
      # Populated from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
      # AWS_REGION / AWS_BUCKET_NAME.
      accessKeyId: ""
      secret: ""
      region: ""
      bucket: ""
    gcloud:
      enabled: false
      bucket_name: ""

  # pam SMTP settings. Populated from SMTP_HOST / SMTP_PORT / SMTP_FROM /
  # SMTP_PASSWORD.
  smtp:
    host: ""
    port: 0
    username: ""
    password: ""

  # issuer SMTP settings -- the issuer module reads email.* where pam reads
  # smtp.*. Populated from the same environment variables.
  email:
    host: ""
    port: 0
    username: ""
    password: ""

  url:
    # Populated from AUTHNZ_URL.
    authnzurl: ""
    # log-workflows service. Not deployed on-prem, so issuer audit-log POSTs are
    # skipped while this is blank.
    loggingurl: ""

  # Authz endpoint used by the pam module. Populated from AUTHNZ_URL.
  Authz:
    url: ""

  services:
    # Populated from SSI_SERVICE.
    ssiService:
      url: ""
    # pam calls the issuer directly via a Go function -- no URL needed.
    issuer:
      base_url: ""
    # No longer used: issuer -> wallet acknowledgeCredential is now a direct Go
    # call. Kept only so an older config file does not look truncated.
    walletService:
      url: ""
    # No longer used: serviceaccounts -> issuer createServiceAccountCredential is
    # now a direct Go call.
    issuerService: ""

  # No longer used: the pam calls that read these (holder DID, wallet register,
  # AD credential v1/v2) are now direct Go calls into the issuer and wallet
  # modules. Retained for reference only.
  did:
    url: http://localhost:8080/api/v1/issuer/did/createHolderDid
    wallet: http://localhost:8080/api/v1/wallet/registerDevice
    adurl: http://localhost:8080/api/v1/issuer/credential/createADUserCredential
    adv2url: http://localhost:8080/api/v1/issuer/credential/createADUserCredentialV2

  issuer:
    # Left blank deliberately: read as a complete URL, but the payload sent is a
    # policy DTO with no matching issuer endpoint. It was also unset in the
    # original policy-service, so this path has never been live.
    policy_credential: ""

production:
  port: "8080"

  db:
    name: ""

  redis:
    host: ""
    key: ""

  logger:
    path: /var/log/authnull

  files:
    csv:
      base_path: /var/authnull/uploads/csv
    ldif:
      base_path: /var/authnull/uploads/ldif

  storage:
    local:
      enabled: true
    aws:
      enabled: false
      accessKeyId: ""
      secret: ""
      region: ""
      bucket: ""
    gcloud:
      enabled: false
      bucket_name: ""

  smtp:
    host: ""
    port: 0
    username: ""
    password: ""

  email:
    host: ""
    port: 0
    username: ""
    password: ""

  url:
    authnzurl: ""
    loggingurl: ""

  Authz:
    url: ""

  services:
    ssiService:
      url: ""
    issuer:
      base_url: ""
    walletService:
      url: ""
    issuerService: ""

  did:
    url: http://localhost:8080/api/v1/issuer/did/createHolderDid
    wallet: http://localhost:8080/api/v1/wallet/registerDevice
    adurl: http://localhost:8080/api/v1/issuer/credential/createADUserCredential
    adv2url: http://localhost:8080/api/v1/issuer/credential/createADUserCredentialV2

  issuer:
    policy_credential: ""
