    ##########################################################################
    # STEP 5 — Tenant subdomain (activated)
    #
    # Before this block will work:
    #   1. Confirm the exact tenant URL generated after org signup
    #      (e.g. default.beta.prod.authnull.com)
    #   2. Confirm DNS resolves for it:
    #        dig +short default.beta.prod.authnull.com @1.1.1.1
    #   3. Get its dedicated certificate (a wildcard for *.prod.authnull.com
    #      does NOT cover this — it's a two-label subdomain):
    #        sudo certbot certonly --nginx -d default.beta.prod.authnull.com
    #   4. Replace "default.beta.prod.authnull.com" everywhere below
    #      with the real value confirmed in step 1.
    ##########################################################################

    server {
        listen 80;
        server_name default.beta.prod.authnull.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name default.beta.prod.authnull.com;
        ssl_certificate /etc/letsencrypt/live/default.beta.prod.authnull.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/default.beta.prod.authnull.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 50m;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 60;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /pam/api/v1/ {
            proxy_pass http://onprem_pam/api/v1/;
            proxy_http_version 1.1;
            # proxy_set_header here replaces the server-level ones, so repeat them all
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header Access-Control-Allow-Origin;
