    ##########################################################################
    # STEP 5 â€” Tenant subdomain (activated)
    #
    # Before this block will work:
    #   1. Confirm the exact tenant URL generated after org signup
    #      (e.g. default.orgname.customer-domain.com)
    #   2. Confirm DNS resolves for it:
    #        dig +short default.orgname.customer-domain.com @1.1.1.1
    #   3. Get its dedicated certificate (a wildcard for *.customer-domain.com
    #      does NOT cover this â€” it's a two-label subdomain):
    #        sudo certbot certonly --nginx -d default.orgname.customer-domain.com
    #   4. Replace "default.orgname.customer-domain.com" everywhere below
    #      with the real value confirmed in step 1.
    ##########################################################################

    # HTTP -> HTTPS redirect. Enable this ONLY after switching the tenant
    # server block below to "listen 443 ssl;".
    #server {
    #    listen 80;
    #    server_name default.orgname.customer-domain.com;    # update the customer domain
    #    return 301 https://$host$request_uri;
    #}

    server {
        listen 80;
        server_name default.orgname.customer-domain.com;    # update the customer domain

        # --- Enable HTTPS after certbot: comment "listen 80;" above and
        #     uncomment the five lines below ---
        #listen 443 ssl;
        #ssl_certificate /etc/letsencrypt/live/default.orgname.customer-domain.com/fullchain.pem;     # update the ssl
        #ssl_certificate_key /etc/letsencrypt/live/default.orgname.customer-domain.com/privkey.pem;   # update the ssl
        #include /etc/letsencrypt/options-ssl-nginx.conf;
        #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 50m;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 60;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /pam/api/v1/ {
            proxy_pass http://onprem_pam/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
