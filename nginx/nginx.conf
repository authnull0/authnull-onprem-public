            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
        }
        location /ssc/ {
            proxy_pass http://onprem_ssc/ssc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            sub_filter 'src="/static/'  'src="/ssc-static/';
            sub_filter 'href="/static/' 'href="/ssc-static/';
            sub_filter 'src="/env.js"'  'src="/ssc-env.js"';
            sub_filter_once off;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;
            if ($request_method = 'OPTIONS') { return 204; }
        }
        location /ssc-static/ {
            proxy_pass http://onprem_ssc/static/;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            sub_filter '/static/media/' '/ssc-static/media/';
            sub_filter_once off;
        }
        location = /ssc-env.js {
            proxy_pass http://onprem_ssc/env.js;
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://onprem_frontend;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
        }
