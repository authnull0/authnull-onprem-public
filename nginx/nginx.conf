user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;
    client_body_buffer_size 128k;
    proxy_request_buffering on;
    client_body_temp_path /var/lib/nginx/body_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Loggings
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    # NOTE: replace "customer-domain.com" everywhere in this file with the
    # customer's actual domain before running certbot / reloading nginx.
    map $http_origin $cors_origin {
        default "";
        "https://onprem.orgname.customer-domain.com" "https://onprem.orgname.customer-domain.com";  # update the domain
        "~^https://[a-z0-9.-]+\.customer-domain\.com$" $http_origin;                # update the domain
    }

    upstream onprem_frontend {
        server localhost:5173;
    }
    upstream onprem_ssc {
        server localhost:3000;
    }
    upstream onprem_mfa {
        server localhost:8085;
    }
    upstream onprem_authn {
        server localhost:2882;
    }
    upstream onprem_pam {
        server localhost:9090;
    }
    upstream onprem_verifier {
        server localhost:6062;
    }
    upstream onprem_database {
        server localhost:9234;
    }
    upstream onprem_ad {
        server localhost:6064;
    }
    upstream onprem_log {
        server localhost:9255;
    }
    upstream onprem_secret {
        server localhost:9291;
    }
    upstream onprem_dashboard {
        server localhost:9211;
    }
    upstream onprem_wallet {
        server localhost:6061;
    }
    upstream onprem_blockchain {
        server localhost:6065;
    }
    upstream onprem_okta {
        server localhost:6067;
    }
    upstream onprem_policy {
        server localhost:7079;
    }
    upstream onprem_service_accounts {
        server localhost:2000;
    }
    upstream onprem_dbconsole {
        server localhost:6967;
    }
    upstream onprem_minio {
        server localhost:9595;
    }
    upstream onprem_entra {
        server localhost:6090;
    }
    upstream onprem_user {
        server localhost:8000;
    }
    upstream onprem_issuer {
        server localhost:6060;
    }
    upstream onprem_authnz {
        server localhost:6066;
    }


    ##########################################################################
    # STEP 4 â€” Main application domain
    #
    # IMPORTANT â€” the hostname shape is load-bearing, not cosmetic.
    # Every login resolves the organisation's Postgres database from the
    # SECOND dot-separated label of the host the browser used:
    #
    #     onprem.orgname.customer-domain.com
    #            ^^^^^^^ must equal ORG_NAME in .env
    #
    # Replace "orgname" with ORG_NAME and "customer-domain.com" with the
    # customer's domain. Do NOT collapse this to "onprem.customer-domain.com"
    # and do NOT use a bare IP address: the second label would then be
    # "customer-domain" or an octet, and every login fails with
    # `database "<that label>" does not exist`.
    #
    # ------------------------------------------------------------------------
    # This block currently serves over plain HTTP on port 80 (no certs yet).
    # To switch to HTTPS after certbot has issued the certificate:
    #   1. comment out the "listen 80;" line below
    #   2. uncomment the "listen 443 ssl;" + ssl_* lines below
    #   3. re-enable the HTTP->HTTPS redirect server block above it
    ##########################################################################

    # HTTP -> HTTPS redirect. Enable this ONLY after switching the main
    # server block below to "listen 443 ssl;", otherwise two servers would
    # both listen on :80 for the same name and conflict.
    #server {
    #    listen 80;
    #    server_name onprem.orgname.customer-domain.com; # update the domain
    #    return 301 https://$host$request_uri;
    #}

    server {
        listen 80;
        server_name onprem.orgname.customer-domain.com; # update the domain

        # --- Enable HTTPS after certbot: comment "listen 80;" above and
        #     uncomment the five lines below ---
        #listen 443 ssl;
        #ssl_certificate /etc/letsencrypt/live/onprem.orgname.customer-domain.com/fullchain.pem;     # update the ssl
        #ssl_certificate_key /etc/letsencrypt/live/onprem.orgname.customer-domain.com/privkey.pem;   # update the ssl
        #include /etc/letsencrypt/options-ssl-nginx.conf;
        #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 50m;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 60;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /pam/ {
            proxy_pass http://onprem_pam/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
        }
        location /api/v1/verifierService/ {
            proxy_pass http://onprem_verifier/api/v1/verifierService/;
            proxy_hide_header Access-Control-Allow-Origin;
