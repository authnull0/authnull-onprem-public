# Fluent Bit, on-prem: Authnull security events to each tenant's SIEM.
# See docker-compose.yml beside this file.

[SERVICE]
    Flush                     1
    Log_Level                 info
    # The reload API: authnull-service calls POST /api/v2/reload after it
    # rewrites a tenant's output. Stack network only; nothing publishes 2020.
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Hot_Reload                On
    # Events are kept on disk until delivered, so a SIEM outage or a restart
    # here does not lose them.
    storage.path              /buffer
    storage.sync              normal
    storage.checksum          On
    storage.backlog.mem_limit 16M

# authnull-service posts JSON arrays to /siem.<org id>.ssh (and, for tenants
# using syslog, /siem.<org id>.ssh.syslog); the path is the tag. Each tenant's
# output matches its organisation's tag: SSH gateways belong to an
# organisation, and every tenant of it that selects "SSH Gateway Logs" gets them.
[INPUT]
    Name              http
    Listen            0.0.0.0
    Port              9880
    Buffer_Max_Size   4M
    Buffer_Chunk_Size 512K
    storage.type      filesystem

# One file per tenant, written by authnull-service from Logs Config, plus a
# placeholder so that a fresh install starts with none.
@INCLUDE outputs/*.conf
